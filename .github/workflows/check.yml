name: check

on:
  # reused by main.yml (PR + trunk) and update-dependencies.yml (bumped branch)
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and test (defaults to the triggering ref)
        type: string
        default: ''

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ESLINT_JUNIT_OUTPUT_FILE: reports/lint.junit.xml
      JEST_JUNIT_OUTPUT_FILE: reports/test.junit.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # empty ref → checkout's default (the triggering ref); set by callers to test a branch
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run docs:build:readmes
      - run: npm run lint -- --format junit --output-file ${ESLINT_JUNIT_OUTPUT_FILE}
      - run: npm run test -- --ci --reporters=default --reporters=jest-junit
      - uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: success() || failure()
        with:
          check_name: Report
          include_passed: true
          report_paths: reports/*.junit.xml
